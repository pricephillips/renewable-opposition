name: Brief format

# Keeps the shared county brief format in step with pricephillips/data-centers.
# scripts/brief_core.py is a copy of that repository's brief_core.py, pinned by
# config/brief_format.lock here and configs/brief_format.lock there. On a
# change to either file, and weekly, this compares the lock here with the one
# on data-centers' main and fails when the format version or the hash differs.
#
# data-centers is private, so the read uses the same secret as
# variable-format.yml (VARIABLE_FORMAT_SIBLING_TOKEN). Without it, or when the
# read fails, the job warns "sibling not readable" and checks only this
# repository's own lock.

on:
  schedule:
    - cron: "47 10 * * 1"
  push:
    branches: [main]
    paths:
      - "config/brief_format.lock"
      - "scripts/brief_core.py"
  pull_request:
    paths:
      - "config/brief_format.lock"
      - "scripts/brief_core.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Fetch the sibling's lock
        id: sibling
        env:
          GH_TOKEN: ${{ secrets.VARIABLE_FORMAT_SIBLING_TOKEN || github.token }}
        run: |
          if gh api -H "Accept: application/vnd.github.raw" \
               "repos/pricephillips/data-centers/contents/configs/brief_format.lock?ref=main" \
               > "$RUNNER_TEMP/sibling.lock" 2> "$RUNNER_TEMP/sibling.err"; then
            echo "readable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::sibling not readable: $(head -c 200 "$RUNNER_TEMP/sibling.err")"
            echo "readable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the format's own tests
        run: python scripts/brief_core.py --selftest
      - name: Compare the locks
        if: steps.sibling.outputs.readable == 'true'
        run: python scripts/county_briefs.py compare-lock --lock "$RUNNER_TEMP/sibling.lock"
      - name: Check this repository's own lock
        if: steps.sibling.outputs.readable != 'true'
        run: python scripts/county_briefs.py compare-lock --lock config/brief_format.lock
