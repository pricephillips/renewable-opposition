name: Fetch model inputs

# The inputs to the county restriction model and the project universe
# (docs/predictive_foundation_design.md, steps 1 and 3):
#   scripts/fetch_county_covariates.py  ACS 5-year and Gazetteer (Census),
#                                       MEDSL presidential returns
#   scripts/fetch_queued_up.py          LBNL Queued Up interconnection queues
#   scripts/queue_matches.py            contested projects matched to their
#                                       requests (a build stage: every data
#                                       build reruns it, so the committed
#                                       matches follow the outcomes; here it
#                                       follows a new Queued Up edition)
#   scripts/county_labels.py and         the registered county restriction
#   scripts/county_restriction_model.py  model, refit on the month's data
#                                       (outputs in data/model/, internal)
# Both sources change about once a year; each script rewrites nothing when
# every input file's SHA-256 matches its manifest, so a month with no new
# release commits nothing. Nothing in the build reads these files, so this
# job never runs the build; it runs only the queue_matches build stage.
#
# On main the fetched files are committed. On any other branch nothing is
# pushed: the job fails if the live fetch does not reproduce the files
# committed on that branch, so a green run there is the proof that the
# scripts work against the live sources. A push to a branch that changes
# either script starts that proof by itself (a manual run needs the workflow
# on main first).

on:
  workflow_dispatch:
  schedule:
    # The 6th of each month, 06:29 UTC.
    - cron: '29 6 6 * *'
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/fetch_county_covariates.py'
      - 'scripts/fetch_queued_up.py'
      - 'scripts/queue_matches.py'
      - 'scripts/county_labels.py'
      - 'scripts/county_restriction_model.py'
      - 'scripts/calibration_gate.py'
      - 'config/county_model_registration.json'
      - 'tests/test_model_inputs.py'
      - 'data/reference/medsl/*'
      - '.github/workflows/model-inputs.yml'

permissions:
  contents: write
  issues: write

# Shares build-data.yml's group: both commit to the branch they run on.
concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Credentials are kept (zizmor: artipacked) because the last step
        # pushes on main.

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv pip install --system -c requirements/ci.txt -r requirements.txt

      - name: Tests for both scripts (fixtures; no network)
        run: python -m pytest -q tests/test_model_inputs.py tests/test_county_model.py

      - name: Fetch
        run: python scripts/run_pipeline.py refresh --only fetch_county_covariates --only fetch_queued_up --only queue_matches --only county_labels --only county_restriction_model --skip-build --summary "$GITHUB_STEP_SUMMARY"

      - name: Branch run reproduces the committed files
        if: github.ref != 'refs/heads/main'
        run: |
          git status --porcelain -- data/reference/
          git diff --exit-code --stat -- data/reference/
          test -z "$(git status --porcelain -- data/reference/)"

      - name: Commit fetched files (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/county_covariates.csv data/reference/county_covariates_manifest.csv data/reference/county_covariates_catalog.json data/reference/queue_projects.csv data/reference/queued_up_manifest.csv data/reference/queue_matches.csv data/reference/queue_matches_report.md data/model/
          git diff --cached --quiet && exit 0
          git commit -m "Fetch model inputs"
          # Another workflow may have moved the branch since checkout. Rebase
          # and retry; never force-push.
          for i in 1 2 3; do
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "Push rejected (attempt $i); rebasing on the latest branch"
            git fetch --no-tags origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; echo "::error::rebase conflict"; exit 1; }
            sleep $((i * 5))
          done
          echo "::error::push failed after 3 attempts"; exit 1

      - name: Open an issue on failure (main only)
        # A job that hits timeout-minutes ends cancelled, not failed.
        if: (failure() || cancelled()) && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fetch model inputs failed (${context.sha.slice(0, 7)})`,
              body: `The monthly fetch of the model inputs failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe files in data/reference/ were not updated. If the log names the MEDSL file, it says how to replace it.`,
            });
