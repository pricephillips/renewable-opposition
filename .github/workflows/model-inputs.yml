name: Fetch model inputs

# The inputs to the county restriction model and the project universe
# (docs/predictive_foundation_design.md, steps 1 and 3):
#   scripts/fetch_county_covariates.py  ACS 5-year and Gazetteer (Census),
#                                       MEDSL presidential returns
#   scripts/fetch_queued_up.py          LBNL Queued Up interconnection queues
# Both sources change about once a year; each script rewrites nothing when
# every input file's SHA-256 matches its manifest, so a month with no new
# release commits nothing. Nothing in the build reads these files yet, so
# this job never runs the build.
#
# On main the fetched files are committed. On any other branch (a run started
# by hand to prove a change to either script) nothing is pushed: the job
# fails if the live fetch does not reproduce the files committed on that
# branch, so a green run there is the proof that the scripts work against the
# live sources.

on:
  workflow_dispatch:
  schedule:
    # The 6th of each month, 06:29 UTC.
    - cron: '29 6 6 * *'

permissions:
  contents: write
  issues: write

# Shares build-data.yml's group: both commit to the branch they run on.
concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Credentials are kept (zizmor: artipacked) because the last step
        # pushes on main.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv pip install --system -c requirements/ci.txt -r requirements.txt

      - name: Tests for both scripts (fixtures; no network)
        run: python -m pytest -q tests/test_model_inputs.py

      - name: Fetch
        run: python scripts/run_pipeline.py refresh --only fetch_county_covariates --only fetch_queued_up --skip-build --summary "$GITHUB_STEP_SUMMARY"

      - name: Branch run reproduces the committed files
        if: github.ref != 'refs/heads/main'
        run: |
          git status --porcelain -- data/reference/
          git diff --exit-code --stat -- data/reference/
          test -z "$(git status --porcelain -- data/reference/)"

      - name: Commit fetched files (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/county_covariates.csv data/reference/county_covariates_manifest.csv data/reference/county_covariates_catalog.json data/reference/queue_projects.csv data/reference/queued_up_manifest.csv
          git diff --cached --quiet && exit 0
          git commit -m "Fetch model inputs"
          # Another workflow may have moved the branch since checkout. Rebase
          # and retry; never force-push.
          for i in 1 2 3; do
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "Push rejected (attempt $i); rebasing on the latest branch"
            git fetch --no-tags origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; echo "::error::rebase conflict"; exit 1; }
            sleep $((i * 5))
          done
          echo "::error::push failed after 3 attempts"; exit 1

      - name: Open an issue on failure (main only)
        # A job that hits timeout-minutes ends cancelled, not failed.
        if: (failure() || cancelled()) && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fetch model inputs failed (${context.sha.slice(0, 7)})`,
              body: `The monthly fetch of the model inputs failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe files in data/reference/ were not updated. If the log names the MEDSL file, it says how to replace it.`,
            });
