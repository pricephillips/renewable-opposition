name: Build dashboard data

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/seed/*.csv'
      - 'scripts/build_seed_outputs.py'
      - 'scripts/qc_gate.py'
      - 'scripts/state_bounds.py'
      - 'scripts/common.py'
      - 'scripts/processed_diff.py'
      - 'data/source_archive.csv'
      - 'data/review/outcome_resolutions.csv'
      - 'data/review/restriction_sources.csv'
      - 'scripts/classify.py'
      - 'scripts/headline_metrics.py'
      - 'scripts/resolutions.py'
      - 'scripts/verification_worklist.py'
      - 'scripts/coverage_delta.py'
      - 'data/county_fips_lookup.json'
      - 'data/place_county_index.json'
      - 'data/geo/counties_2024.topojson'
      - 'scripts/geo.py'
      - 'config/coverage_expectations.json'
      - 'requirements/ci.txt'
      - '.github/workflows/build-data.yml'

permissions:
  contents: write
  issues: write

# This job commits generated files. Serialize runs per branch and never cancel
# one mid-way, so two pushes cannot race to write data/processed/.
concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD~1 must exist for the processed-data diff. Credentials are
          # kept (zizmor: artipacked) because the last step pushes.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv pip install --system -c requirements/ci.txt -r requirements.txt daff

      - name: Run build script
        run: python scripts/build_seed_outputs.py

      - name: Rank what to verify next
        run: python scripts/verification_worklist.py

      - name: Column coverage gate (blocks publishing a collapsed column)
        run: python scripts/coverage_delta.py

      - name: Record snapshot manifest
        run: python scripts/snapshot_manifest.py

      - name: Diff processed data against the previous commit
        run: python scripts/processed_diff.py

      - name: Publish QC report
        if: always()
        run: cat data/processed/qc_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publish processed-data diff
        if: always()
        run: cat data/processed/diff_summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publish headline metrics and coverage
        if: always()
        run: cat data/processed/headline_metrics.md data/processed/coverage_delta.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/ data/snapshots/manifest.csv data/review/outcome_worklist.csv data/review/restriction_worklist.csv data/review/fips_misses.csv
          git diff --cached --quiet && exit 0
          git commit -m "Build processed dashboard data"
          # Another workflow may have moved the branch since checkout. Rebase
          # and retry; never force-push.
          for i in 1 2 3; do
            git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "Push rejected (attempt $i); rebasing on the latest branch"
            git fetch --no-tags origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; echo "::error::rebase conflict"; exit 1; }
            sleep $((i * 5))
          done
          echo "::error::push failed after 3 attempts"; exit 1

      - name: Open an issue on failure (main only)
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build dashboard data failed (${context.sha.slice(0, 7)})`,
              body: `The data build failed on main. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe published data in data/processed/ was not updated.`,
            });
