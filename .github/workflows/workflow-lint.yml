name: Workflow Lint

# Lints every workflow on change (spec 004, US2). Copied from
# pricephillips/data-center-map .github/workflows/workflow-lint.yml.
#   actionlint  BLOCKING. Syntax, expressions, and shellcheck on run: blocks.
#   zizmor      REPORT-ONLY. Security audit; findings go to the job summary.
#               Unpinned actions were fixed when this was added. The
#               remaining medium findings (artipacked on build-data.yml,
#               source-archive.yml and intake.yml, which must keep credentials
#               to push) are listed, not blocking.
# One job, and push runs on main only: a branch's workflow change is linted by
# its pull request, so the same commit is not linted twice (as data-center-map
# did in its 3643691 and ce7e194).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: actionlint (with the runner's shellcheck)
        run: uvx --from actionlint-py actionlint
      - name: zizmor (report-only)
        if: always()
        continue-on-error: true
        run: |
          uvx zizmor --offline --format plain .github/workflows > zizmor.txt || true
          {
            echo "## zizmor (report-only)"
            echo '```'
            cat zizmor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
