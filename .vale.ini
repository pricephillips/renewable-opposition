# Prose lint for client-facing markdown. Adapted from
# pricephillips/data-center-map .vale.ini
# (docs/PASSOFF_2026-09-29_tooling_from_data_center_map.md, A7). Scorekeeping
# is not copied: this repo shares the outcome ladder and has no vocabulary
# audit to keep it in sync with. Headline sentences that live in the pages'
