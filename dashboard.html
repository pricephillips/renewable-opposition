<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renewable Opposition Dashboard</title>
  <meta name="description" content="Dashboard for renewable opposition records parsed from PDF into a single CSV.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
      --space-12: 3rem; --space-16: 4rem;
      --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-surface-2: #fbfbf9;
      --color-surface-offset: #edeae5; --color-border: #d4d1ca; --color-divider: #dcd9d5;
      --color-text: #28251d; --color-text-muted: #6f6c66; --color-text-faint: #9b9892;
      --color-text-inverse: #f9f8f4; --color-primary: #01696f; --color-primary-hover: #0c4e54;
      --color-primary-highlight: #d8e8e6; --radius-sm: 0.375rem; --radius-md: 0.5rem;
      --radius-lg: 0.75rem; --radius-xl: 1rem; --shadow-sm: 0 1px 2px rgba(40,37,29,0.06);
      --shadow-md: 0 12px 32px rgba(40,37,29,0.12); --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="dark"] {
      --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
      --color-surface-offset: #2a2825; --color-border: #393836; --color-divider: #2a2927;
      --color-text: #e4e1db; --color-text-muted: #aaa69f; --color-text-faint: #7c7973;
      --color-text-inverse: #171614; --color-primary: #4f98a3; --color-primary-hover: #68aab4;
      --color-primary-highlight: #23383d; --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 12px 32px rgba(0,0,0,0.32);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
        --color-surface-offset: #2a2825; --color-border: #393836; --color-divider: #2a2927;
        --color-text: #e4e1db; --color-text-muted: #aaa69f; --color-text-faint: #7c7973;
        --color-text-inverse: #171614; --color-primary: #4f98a3; --color-primary-hover: #68aab4;
        --color-primary-highlight: #23383d; --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
        --shadow-md: 0 12px 32px rgba(0,0,0,0.32);
      }
    }
    * { box-sizing: border-box; }
    *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: none; text-size-adjust: none; scroll-behavior: smooth; }
    body {
      margin: 0; font-family: 'Inter', system-ui, sans-serif; font-size: var(--text-base);
      background: var(--color-bg); color: var(--color-text); min-height: 100dvh; overflow-wrap: anywhere;
    }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { color: var(--color-primary-hover); text-decoration: underline; }
    button, input, select { font: inherit; }
    button {
      cursor: pointer; border: 1px solid var(--color-border); background: var(--color-surface-2);
      color: inherit; border-radius: var(--radius-md); min-height: 44px;
      transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
    }
    input, select {
      width: 100%; min-height: 44px; border: 1px solid var(--color-border); background: var(--color-surface-2);
      color: inherit; border-radius: var(--radius-md); padding: 0.7rem 0.85rem;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    button:hover, input:hover, select:hover { border-color: var(--color-text-faint); }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid var(--color-primary); outline-offset: 2px;
    }
    .app { display: grid; grid-template-rows: auto 1fr; min-height: 100dvh; }
    header {
      background: color-mix(in srgb, var(--color-bg) 92%, transparent); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border); padding: var(--space-4) var(--space-8);
      display: flex; align-items: center; gap: var(--space-4); justify-content: space-between;
      position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm);
    }
    .header-left { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .logo {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px;
      border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-primary);
      box-shadow: var(--shadow-sm); flex: 0 0 auto;
    }
    .site-title { font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
    .site-subtitle { font-size: var(--text-xs); color: var(--color-text-muted); overflow-wrap: anywhere; }
    .header-actions { display: flex; gap: var(--space-2); align-items: center; }
    .theme-toggle, .refresh-btn, .export-btn { padding: 0.6rem 0.9rem; }
    main { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
    .sidebar {
      background: var(--color-surface); border-right: 1px solid var(--color-border); padding: var(--space-6);
      display: flex; flex-direction: column; gap: var(--space-6); position: sticky; top: 73px;
      height: calc(100dvh - 73px); overflow-y: auto;
    }
    .filter-group { display: flex; flex-direction: column; gap: var(--space-2); }
    .filter-label {
      font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--color-text-muted);
    }
    .reset-btn { padding: 0.7rem 0.9rem; text-align: center; background: var(--color-surface); }
    .sidebar-section { display: flex; flex-direction: column; gap: var(--space-3); }
    .mini-card {
      background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
      padding: var(--space-3);
    }
    .mini-title {
      font-size: var(--text-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: var(--space-2); font-weight: 600;
    }
    .list-compact { display: grid; gap: var(--space-2); }
    .list-row {
      display: flex; justify-content: space-between; gap: var(--space-3); align-items: start;
      font-size: var(--text-sm);
    }
    .list-row .name { color: var(--color-text); min-width: 0; overflow-wrap: anywhere; }
    .list-row .value { color: var(--color-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .content {
      padding: var(--space-6) var(--space-8); overflow-y: auto; overflow-x: hidden;
      height: calc(100dvh - 73px); display: flex; flex-direction: column; gap: var(--space-6); min-width: 0;
    }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-4); }
    .stat-card {
      background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
      padding: var(--space-4); box-shadow: var(--shadow-sm);
    }
    .stat-value { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.03em; color: var(--color-primary); }
    .stat-label { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1); }
    .subgrid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: var(--space-4); }
    .insight-card, .table-wrap {
      background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .insight-card { padding: var(--space-4); }
    .insight-title { font-size: var(--text-sm); font-weight: 600; color: var(--color-text-muted); margin-bottom: var(--space-3); }
    .bar-list { display: grid; gap: var(--space-3); }
    .bar-row { display: grid; gap: var(--space-1); }
    .bar-meta { display: flex; justify-content: space-between; gap: var(--space-3); font-size: var(--text-sm); }
    .bar-track { height: 10px; background: var(--color-surface-offset); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--color-primary); border-radius: 999px; }
    .tabs {
      display: flex; gap: var(--space-1); border-bottom: 2px solid var(--color-divider); overflow-x: auto;
    }
    .tab-btn {
      padding: var(--space-2) var(--space-4); font-size: var(--text-sm); font-weight: 500; color: var(--color-text-muted);
      border: none; border-bottom: 2px solid transparent; border-radius: var(--radius-md) var(--radius-md) 0 0;
      background: transparent; min-height: 42px; white-space: nowrap; margin-bottom: -2px;
    }
    .tab-btn:hover { color: var(--color-text); background: var(--color-surface); }
    .tab-btn.active { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: 600; }
    .tab-count {
      display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px;
      padding: 0 var(--space-1); font-size: 11px; font-weight: 600; border-radius: 999px;
      background: var(--color-primary-highlight); color: var(--color-primary); margin-left: var(--space-2);
    }
    .table-toolbar {
      display: flex; justify-content: space-between; gap: var(--space-3); align-items: center; flex-wrap: wrap;
      color: var(--color-text-muted); font-size: var(--text-sm);
    }
    .table-wrap { overflow: auto; min-height: 320px; }
    table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); min-width: 1080px; }
    thead tr { background: var(--color-surface-2); border-bottom: 1px solid var(--color-border); }
    th {
      padding: var(--space-3) var(--space-4); text-align: left; font-size: var(--text-xs); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); white-space: nowrap;
      cursor: pointer; user-select: none;
    }
    td {
      padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-divider); vertical-align: top;
      max-width: 280px; overflow-wrap: anywhere; word-break: break-word;
    }
    tr:last-child td { border-bottom: none; }
    tr.data-row { cursor: pointer; }
    tr.data-row:hover td { background: var(--color-primary-highlight); }
    .td-desc {
      color: var(--color-text-muted); font-size: var(--text-xs); display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; word-break: break-word;
    }
    .empty-state { padding: var(--space-12) var(--space-8); text-align: center; color: var(--color-text-muted); font-size: var(--text-sm); }
    .severity-pill {
      display: inline-flex; align-items: center; justify-content: center; min-width: 56px; height: 24px;
      padding: 0 0.5rem; border-radius: 999px; font-size: 11px; font-weight: 700;
    }
    .severity-low { background: #e8f5e9; color: #2e7d32; }
    .severity-medium { background: #fff8e1; color: #f57f17; }
    .severity-high { background: #fce4ec; color: #b71c1c; }
    [data-theme="dark"] .severity-low { background: #1b3a1e; color: #81c784; }
    [data-theme="dark"] .severity-medium { background: #3a2e00; color: #ffd54f; }
    [data-theme="dark"] .severity-high { background: #3b0d1a; color: #f48fb1; }
    .tag {
      display: inline-block; padding: 2px var(--space-2); border-radius: var(--radius-sm); font-size: 11px;
      font-weight: 500; background: var(--color-primary-highlight); color: var(--color-primary);
      white-space: nowrap; margin: 0 0.25rem 0.25rem 0;
    }
    .status-chip {
      display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
      background: var(--color-surface-offset); color: var(--color-text-muted); font-size: 11px; font-weight: 600;
      text-transform: lowercase;
    }
    .panel-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; display: none;
      align-items: flex-start; justify-content: flex-end;
    }
    .panel-backdrop.open { display: flex; }
    .panel {
      background: var(--color-surface); width: min(680px, 96vw); height: 100dvh; overflow-y: auto;
      box-shadow: var(--shadow-md); border-left: 1px solid var(--color-border); padding: var(--space-6);
      display: flex; flex-direction: column; gap: var(--space-4);
    }
    .panel-close {
      align-self: flex-end; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-md); background: transparent;
    }
    .panel-type {
      font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-primary);
    }
    .panel-title { font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
    .panel-meta { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
    .panel-divider { border: none; border-top: 1px solid var(--color-divider); margin: 0; }
    .panel-section-label {
      font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--color-text-muted); margin-bottom: var(--space-2);
    }
    .panel-body { font-size: var(--text-sm); line-height: 1.7; overflow-wrap: anywhere; word-break: break-word; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3) var(--space-4); }
    .field { display: flex; flex-direction: column; gap: 2px; }
    .field-name { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 500; text-transform: capitalize; }
    .field-val { font-size: var(--text-sm); color: var(--color-text); overflow-wrap: anywhere; word-break: break-word; }
    @media (max-width: 1100px) { .subgrid { grid-template-columns: 1fr; } }
    @media (max-width: 920px) {
      header { padding: var(--space-4); }
      main { grid-template-columns: 1fr; }
      .sidebar { position: static; top: auto; height: auto; border-right: none; border-bottom: 1px solid var(--color-border); }
      .content { height: auto; overflow-y: visible; padding: var(--space-4); }
    }
    @media (max-width: 720px) {
      .header-left { align-items: flex-start; width: 100%; }
      .header-actions { width: 100%; flex-wrap: wrap; }
      header { flex-direction: column; align-items: stretch; }
      .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field-grid { grid-template-columns: 1fr; }
      .panel { width: 100vw; }
    }
    @media (max-width: 520px) {
      .stats-row { grid-template-columns: 1fr; }
      .content, .sidebar { padding: var(--space-4); }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-left">
      <div class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="currentColor" opacity="0.1"/>
          <path d="M16 6 L16 18 M10 12 L16 6 L22 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 22 Q16 16 24 22" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          <line x1="8" y1="26" x2="24" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
        </svg>
      </div>
      <div>
        <div class="site-title">Renewable Opposition Dashboard</div>
        <div class="site-subtitle">Enhanced single-file dashboard wired to <code>data/renewable_opposition_records.csv</code></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="refresh-btn" id="refresh-btn" type="button">Refresh data</button>

  <main>
    <aside class="sidebar">
      <div class="filter-group">
        <label class="filter-label" for="search">Search</label>

      </div>
      <div class="filter-group">
        <label class="filter-label" for="filter-state">State</label>
        <select id="filter-state"><option value="">All states</option></select>
      </div>
      <div class="filter-group">
        <label class="filter-label" for="filter-tech">Technology</label>
        <select id="filter-tech"><option value="">All technologies</option></select>
      </div>
      <div class="filter-group">
        <label class="filter-label" for="filter-status">Status</label>
        <select id="filter-status"><option value="">All statuses</option></select>

      <div class="filter-group">

<script>
const CSV_URL = './data/renewable_opposition_records.csv';
let rowsAll = [];
let activeTab = 'restrictions';
let filters = { search: '', state: '', tech: '', status: '', jurisdiction: '', sev: '' };
let sortState = { key: 'adopted_or_event_date_text', dir: 'asc' };
const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function parseCSV(text) {
  const out = [];
  let row = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (ch === '"' && inQuotes && next === '"') { cur += '"'; i++; }
    else if (ch === '"') inQuotes = !inQuotes;
    else if (ch === ',' && !inQuotes) { row.push(cur); cur = ''; }
    else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && next === '\n') i++;
      row.push(cur);
      if (row.some(c => c !== '')) out.push(row);
      row = []; cur = '';
    } else cur += ch;
  }
  if (cur.length || row.length) { row.push(cur); if (row.some(c => c !== '')) out.push(row); }
  if (!out.length) return [];
  const headers = out[0].map(h => h.trim());
  return out.slice(1).map(cols => Object.fromEntries(headers.map((h, i) => [h, (cols[i] ?? '').trim()])));
}

function splitMulti(value) {
  return String(value || '').split(',').map(v => v.trim()).filter(Boolean);
}

function slugDate(value) {
  const s = String(value || '').trim();
  if (!s) return '9999-99';
  const year = s.match(/(19|20)\d{2}/)?.[0] || '9999';
  const months = {
    january:'01', february:'02', march:'03', april:'04', may:'05', june:'06', july:'07', august:'08',
    september:'09', october:'10', november:'11', december:'12', jan:'01', feb:'02', mar:'03', apr:'04',
    jun:'06', jul:'07', aug:'08', sep:'09', sept:'09', oct:'10', nov:'11', dec:'12'
  };
  const lower = s.toLowerCase();
  let month = '99';
  for (const [name, num] of Object.entries(months)) {
    if (lower.includes(name)) { month = num; break; }
  }
  return `${year}-${month}`;
}

function normalizeRow(raw) {
  const r = { ...raw };
  const recordType = (r.record_type || '').toLowerCase();
  const hasLitigation = (r.has_litigation || '').toLowerCase() === 'yes';
  r._tech_list = splitMulti(r.technology);
  r._mechanisms = splitMulti(r.policy_mechanism);
  r._opposition = splitMulti(r.opposition_type);
  r._status = (r.status || '').trim().toLowerCase();
  r._date_sort = slugDate(r.adopted_or_event_date_text);
  r.display_location = [r.municipality || '', r.county || '', r.state || ''].filter(Boolean).join(', ') || r.state || '—';
  if (hasLitigation) r._bucket = 'cases';
  else if (recordType === 'contested_project') r._bucket = 'contested';
  else r._bucket = 'restrictions';
  r.display_bucket_label = r._bucket === 'restrictions' ? 'Restriction' : r._bucket === 'contested' ? 'Contested project' : 'Case';
  r.display_title = r.project_or_policy_name || r.short_description || `${r.display_bucket_label} ${r.record_id || ''}`.trim();
  if (hasLitigation) r._severity_label = 'High';
  else if (r._bucket === 'contested') r._severity_label = 'Medium';
  else r._severity_label = 'Low';
  return r;
}

async function initDashboard() {
  $('load-status').textContent = 'Loading';
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Failed to fetch ${CSV_URL}`);
    const text = await res.text();
    rowsAll = parseCSV(text).map(normalizeRow);
    $('load-status').textContent = 'Loaded';
    $('last-updated').textContent = new Date().toLocaleString();
    populateFilters();
    render();
  } catch (err) {
    $('load-status').textContent = 'Error';
    $('table-container').innerHTML = `<div class="empty-state">Unable to load <code>${escapeHtml(CSV_URL)}</code>. Make sure the CSV exists in the repo data folder.</div>`;
    $('stats-row').innerHTML = '';
    $('table-summary').textContent = '0 records';
    console.error(err);
  }
}

function populateSelect(id, values, label) {
  const el = $(id);
  el.innerHTML = `<option value="">${label}</option>`;
  values.forEach(v => el.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`));
}

function populateFilters() {
  populateSelect('filter-state', [...new Set(rowsAll.map(r => r.state).filter(Boolean))].sort(), 'All states');
  populateSelect('filter-tech', [...new Set(rowsAll.flatMap(r => r._tech_list))].sort(), 'All technologies');
  populateSelect('filter-status', [...new Set(rowsAll.map(r => r.status).filter(Boolean))].sort(), 'All statuses');
  populateSelect('filter-jurisdiction', [...new Set(rowsAll.map(r => r.jurisdiction_level).filter(Boolean))].sort(), 'All jurisdiction levels');
}

function applyFilters(rows) {
  return rows.filter(r => {
    const blob = JSON.stringify(r).toLowerCase();
    if (filters.search && !blob.includes(filters.search.toLowerCase())) return false;
    if (filters.state && r.state !== filters.state) return false;
    if (filters.tech && !r._tech_list.map(t => t.toLowerCase()).includes(filters.tech.toLowerCase())) return false;
    if (filters.status && r.status !== filters.status) return false;
    if (filters.jurisdiction && r.jurisdiction_level !== filters.jurisdiction) return false;
    if (filters.sev) {
      if (filters.sev === '4' || filters.sev === '3') {
        if (r._severity_label !== 'High') return false;
      } else if (filters.sev === '2') {
        if (!['Medium', 'High'].includes(r._severity_label)) return false;
      }
    }
    return true;
  });
}

function sortRows(rows) {
  const arr = [...rows];
  arr.sort((a, b) => {
    let av = a[sortState.key] ?? '';
    let bv = b[sortState.key] ?? '';
    if (sortState.key === 'adopted_or_event_date_text') {
      av = a._date_sort; bv = b._date_sort;
    }
    av = String(av).toLowerCase();
    bv = String(bv).toLowerCase();
    if (av < bv) return sortState.dir === 'asc' ? -1 : 1;
    if (av > bv) return sortState.dir === 'asc' ? 1 : -1;
    return 0;
  });
  return arr;
}

function countBy(rows, getter) {
  const m = new Map();
  rows.forEach(r => {
    const vals = getter(r);
    (Array.isArray(vals) ? vals : [vals]).filter(Boolean).forEach(v => m.set(v, (m.get(v) || 0) + 1));
  });
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

function severityPill(label) {
  const cls = label === 'High' ? 'severity-high' : label === 'Medium' ? 'severity-medium' : 'severity-low';
  return `<span class="severity-pill ${cls}">${escapeHtml(label)}</span>`;
}

function renderBars(elId, pairs, topN = 6) {
  const el = $(elId);
  const top = pairs.slice(0, topN);
  const max = top.length ? top[0][1] : 0;
  if (!top.length) {
    el.innerHTML = '<div class="empty-state" style="padding:1rem 0">No data</div>';
    return;
  }
  el.innerHTML = top.map(([name, value]) => `
    <div class="bar-row">
      <div class="bar-meta"><span>${escapeHtml(name)}</span><span>${value}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${max ? (value / max) * 100 : 0}%"></div></div>
    </div>`).join('');
}

function renderMiniList(elId, pairs, topN = 5) {
  const el = $(elId);
  const top = pairs.slice(0, topN);
  if (!top.length) {
    el.innerHTML = '<div class="list-row"><span class="name">No data</span></div>';
    return;
  }
  el.innerHTML = top.map(([name, value]) => `<div class="list-row"><span class="name">${escapeHtml(name)}</span><span class="value">${value}</span></div>`).join('');
}

function renderQA(all) {
  const qa = [
    ['Missing county', all.filter(r => !r.county).length],
    ['Missing municipality', all.filter(r => !r.municipality).length],
    ['Missing date text', all.filter(r => !r.adopted_or_event_date_text).length],
    ['Missing technology', all.filter(r => !r.technology).length],
    ['Missing status', all.filter(r => !r.status).length],
    ['Has notes', all.filter(r => r.notes).length]
  ];
  $('qa-list').innerHTML = qa.map(([name, value]) => `<div class="list-row"><span class="name">${escapeHtml(name)}</span><span class="value">${value}</span></div>`).join('');
}

function render() {
  const restrictions = rowsAll.filter(r => r._bucket === 'restrictions');
  const contested = rowsAll.filter(r => r._bucket === 'contested');
  const cases = rowsAll.filter(r => r._bucket === 'cases');
  const fr = applyFilters(restrictions);
  const fc = applyFilters(contested);
  const fk = applyFilters(cases);
  const allFiltered = [...fr, ...fc, ...fk];

  $('cnt-r').textContent = fr.length;
  $('cnt-c').textContent = fc.length;
  $('cnt-k').textContent = fk.length;

  renderStats(fr, fc, fk);
  renderMiniList('top-tech', countBy(allFiltered, r => r._tech_list));
  renderQA(allFiltered);
  renderBars('mechanism-bars', countBy(allFiltered, r => r._mechanisms.length ? r._mechanisms : ['(Unspecified / Not applicable)']));
  renderBars('status-bars', countBy(allFiltered, r => r.status || '(blank)'));

  const rows = activeTab === 'restrictions' ? fr : activeTab === 'contested' ? fc : fk;
  const sortedRows = sortRows(rows);
  const tabLabel = activeTab === 'restrictions' ? 'restrictions' : activeTab === 'contested' ? 'contested projects' : 'cases';
  $('table-summary').textContent = `${sortedRows.length} ${sortedRows.length === 1 ? 'record' : 'records'} in ${tabLabel}`;
  $('sort-summary').textContent = `Sorted by ${sortState.key.replace(/_/g, ' ')} (${sortState.dir})`;
  renderTable(sortedRows, activeTab);
}

function renderStats(fr, fc, fk) {
  const all = [...fr, ...fc, ...fk];
  const high = all.filter(r => r._severity_label === 'High').length;
  const states = new Set(all.map(r => r.state).filter(Boolean)).size;
  const withCapacity = all.filter(r => r.project_capacity_mw).length;
  $('stats-row').innerHTML = [
    { value: all.length, label: 'Total records' },
    { value: fr.length, label: 'Restrictions' },
    { value: fc.length, label: 'Contested projects' },
    { value: fk.length, label: 'Cases' },
    { value: high, label: 'High severity (litigation)' },
    { value: states, label: 'States represented' },
    { value: withCapacity, label: 'Capacity field present' }
  ].map(s => `<div class="stat-card"><div class="stat-value">${s.value}</div><div class="stat-label">${escapeHtml(s.label)}</div></div>`).join('');
}

function renderTable(rows, tab) {
  const el = $('table-container');
  if (!rows.length) {
    el.innerHTML = '<div class="empty-state">No records match the current filters.</div>';
    return;
  }
  const cols = tab === 'restrictions'
    ? ['state','county','municipality','jurisdiction_level','project_or_policy_name','technology','policy_mechanism','adopted_or_event_date_text','status','short_description']
    : tab === 'contested'
    ? ['state','county','municipality','project_or_policy_name','technology','opposition_type','project_capacity_mw','adopted_or_event_date_text','status','short_description']
    : ['state','county','municipality','jurisdiction_level','project_or_policy_name','has_litigation','adopted_or_event_date_text','status','short_description'];
  const headers = {
    state: 'State', county: 'County', municipality: 'City/Town', jurisdiction_level: 'Jurisdiction',
    project_or_policy_name: 'Project / Policy', technology: 'Technology', policy_mechanism: 'Policy mechanism',
    opposition_type: 'Opposition', adopted_or_event_date_text: 'Date (text)', status: 'Status',
    has_litigation: 'Litigation', short_description: 'Short description', project_capacity_mw: 'Capacity MW'
  };
  el.innerHTML = `<table>
    <thead><tr>${cols.map(c => `<th data-sort="${c}">${headers[c] || c}${sortState.key === c ? (sortState.dir === 'asc' ? ' ↑' : ' ↓') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="data-row" data-idx="${i}">${cols.map(c => cellHTML(r, c)).join('')}</tr>`).join('')}</tbody>
  </table>`;
  el.querySelectorAll('.data-row').forEach(row => row.addEventListener('click', () => openPanel(rows[Number(row.dataset.idx)])));
  el.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => toggleSort(th.dataset.sort)));
}

function cellHTML(r, col) {
  if (col === 'technology' || col === 'policy_mechanism' || col === 'opposition_type') {
    const vals = splitMulti(r[col]);
    return vals.length ? `<td>${vals.map(v => `<span class="tag">${escapeHtml(v)}</span>`).join('')}</td>` : '<td>—</td>';
  }
  if (col === 'has_litigation') {
    const v = (r.has_litigation || '').toLowerCase();
    return `<td>${escapeHtml(v ? (v === 'yes' ? 'Yes' : v === 'no' ? 'No' : v) : '—')}</td>`;
  }
  if (col === 'status') return `<td>${r.status ? `<span class="status-chip">${escapeHtml(r.status)}</span>` : '—'}</td>`;
  if (col === 'short_description') return `<td><span class="td-desc">${escapeHtml(r.short_description || '—')}</span></td>`;
  return `<td>${escapeHtml(r[col] || '—')}</td>`;
}

function fieldKV(label, value) {
  if (value === '' || value == null) return '';
  return `<div class="field"><span class="field-name">${escapeHtml(label)}</span><span class="field-val">${escapeHtml(value)}</span></div>`;
}

function openPanel(r) {
  $('panel').innerHTML = `
    <button class="panel-close" id="panel-close" aria-label="Close" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="panel-type">${escapeHtml(r.display_bucket_label)}</div>
    <div class="panel-title">${escapeHtml(r.display_title)}</div>
    <div class="panel-meta">
      <span class="tag">${escapeHtml(r.display_location)}</span>
      ${r._tech_list.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
      ${severityPill(r._severity_label)}
      ${r.status ? `<span class="status-chip">${escapeHtml(r.status)}</span>` : ''}
    </div>
    <hr class="panel-divider">
    ${r.short_description ? `<div><div class="panel-section-label">Short description</div><div class="panel-body">${escapeHtml(r.short_description)}</div></div>` : ''}
    ${r.long_description ? `<div><div class="panel-section-label">Long description</div><div class="panel-body">${escapeHtml(r.long_description)}</div></div>` : ''}
    <hr class="panel-divider">
    <div><div class="panel-section-label">Record fields</div><div class="field-grid">
      ${fieldKV('Record ID', r.record_id)}
      ${fieldKV('State', r.state)}
      ${fieldKV('County', r.county)}
      ${fieldKV('Municipality', r.municipality)}
      ${fieldKV('Jurisdiction level', r.jurisdiction_level)}
      ${fieldKV('Record type', r.record_type)}
      ${fieldKV('Source section', r.extraction_source_section)}
      ${fieldKV('Project or policy name', r.project_or_policy_name)}
      ${fieldKV('Technology', r.technology)}
      ${fieldKV('Policy mechanism', r.policy_mechanism)}
      ${fieldKV('Opposition type', r.opposition_type)}
      ${fieldKV('Adopted or event date', r.adopted_or_event_date_text)}
      ${fieldKV('Status', r.status)}
      ${fieldKV('Project capacity MW', r.project_capacity_mw)}
      ${fieldKV('Project area acres', r.project_area_acres)}
      ${fieldKV('Has litigation', r.has_litigation)}
      ${fieldKV('Notes', r.notes)}
    </div></div>
  `;
  $('panel-backdrop').classList.add('open');
  $('panel-close').addEventListener('click', closePanel);
}

function closePanel() { $('panel-backdrop').classList.remove('open'); }

function toggleSort(key) {
  if (sortState.key === key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
  else sortState = { key, dir: 'asc' };
  render();
}

function exportFilteredCSV() {
  const restrictions = rowsAll.filter(r => r._bucket === 'restrictions');
  const contested = rowsAll.filter(r => r._bucket === 'contested');
  const cases = rowsAll.filter(r => r._bucket === 'cases');
  const rows = activeTab === 'restrictions' ? applyFilters(restrictions) : activeTab === 'contested' ? applyFilters(contested) : applyFilters(cases);
  if (!rows.length) return;
  const headers = ['record_id','state','county','municipality','jurisdiction_level','record_type','extraction_source_section','project_or_policy_name','technology','policy_mechanism','opposition_type','adopted_or_event_date_text','status','project_capacity_mw','project_area_acres','has_litigation','short_description','long_description','notes'];
  const csv = [headers.join(',')].concat(rows.map(r => headers.map(h => {
    const v = String(r[h] ?? '');
    return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  }).join(','))).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `renewable_opposition_${activeTab}_filtered.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

$('panel-backdrop').addEventListener('click', e => { if (e.target === e.currentTarget) closePanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
$('search').addEventListener('input', e => { filters.search = e.target.value; render(); });
$('filter-state').addEventListener('change', e => { filters.state = e.target.value; render(); });
$('filter-tech').addEventListener('change', e => { filters.tech = e.target.value; render(); });
$('filter-status').addEventListener('change', e => { filters.status = e.target.value; render(); });
$('filter-jurisdiction').addEventListener('change', e => { filters.jurisdiction = e.target.value; render(); });
$('filter-sev').addEventListener('change', e => { filters.sev = e.target.value; render(); });
$('reset-btn').addEventListener('click', () => {
  filters = { search: '', state: '', tech: '', status: '', jurisdiction: '', sev: '' };
  $('search').value = ''; $('filter-state').value = ''; $('filter-tech').value = '';
  $('filter-status').value = ''; $('filter-jurisdiction').value = ''; $('filter-sev').value = '';
  render();
});
$('refresh-btn').addEventListener('click', () => initDashboard());
$('export-btn').addEventListener('click', exportFilteredCSV);
document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
  btn.classList.add('active'); btn.setAttribute('aria-selected', 'true'); activeTab = btn.dataset.tab; render();
}));
(function initTheme() {
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  let d = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  r.setAttribute('data-theme', d);
  const renderIcon = () => {
    t.setAttribute('aria-label', 'Switch to ' + (d === 'dark' ? 'light' : 'dark') + ' mode');
    t.innerHTML = d === 'dark'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  };
  renderIcon();
  t.addEventListener('click', () => { d = d === 'dark' ? 'light' : 'dark'; r.setAttribute('data-theme', d); renderIcon(); });
})();
initDashboard();
</script>
</body>
</html>
