# sources.yaml
# Source registry for the renewable-opposition crawler.
# Each entry describes one source to fetch periodically.
#
# Fields:
#   source_id     : stable internal key (snake_case, never reuse)
#   url           : canonical entry-point URL to fetch
#   publisher     : human-readable name of the publishing org
#   document_type : ordinance | code_section | meeting_minutes | news |
#                   docket | tracker | siting_board | report
#   jurisdiction_type : state | county | municipality | national
#   state         : two-letter FIPS code, or "US" for national
#   fetch_method  : static | api | js_render (static and api = requests; js_render = playwright, later)
#   schedule      : how often to re-fetch (daily | weekly | monthly)
#   parser_hint   : free-text note for the extraction layer
#   active        : true/false — set false to disable without removing the entry
#   notes         : optional context
#
# Live intake (scripts/run_pipeline.py intake, .github/workflows/intake.yml)
# fetches every active source that something reads: one with an extractor in
# scripts/extractors/<source_id>.py, or one marked watch: true. scripts/fetch.py
# documents the optional request fields (requests, params, expand_from,
# min_interval_s, expect, expect_contains, retry, auth_env, compress, watch,
# on_change).

sources:

  # ── Sabin Center / Columbia ──────────────────────────────────────────────
  - source_id: sabin_opposition_report_2025
    url: https://climate.law.columbia.edu/content/opposition-renewable-energy-facilities-united-states-june-2025-edition
    publisher: Columbia Sabin Center for Climate Change Law
    document_type: report
    jurisdiction_type: national
    state: US
    fetch_method: static
    schedule: monthly
    parser_hint: >
      HTML page with summary statistics and embedded tables of local
      restrictions and contested projects. Also links to PDF full report.
      Extract jurisdiction, technology, restriction_type, and severity signals.
    active: true
    notes: Primary reference document. Re-issued roughly annually.

  - source_id: sabin_blog_2025
    url: https://blogs.law.columbia.edu/climatechange/2025/06/30/local-laws-and-lawsuits-targeting-renewables-becoming-more-prevalent-in-the-us/
    publisher: Columbia Sabin Center for Climate Change Law
    document_type: news
    jurisdiction_type: national
    state: US
    fetch_method: static
    schedule: monthly
    parser_hint: >
      Blog post summarizing June 2025 edition findings. Useful for
      extracting headline counts and state-level breakdowns mentioned
      in prose (e.g. "X counties enacted bans in Y").
    active: true
    notes: Companion to the main report; often contains synthesis not in the PDF.

  - source_id: sabin_opposition_report_pdf_2025
    url: https://climate.law.columbia.edu/sites/default/files/content/Opposition-Report-June-2025.pdf
    publisher: Columbia Sabin Center for Climate Change Law
    document_type: report
    jurisdiction_type: national
    state: US
    fetch_method: static
    schedule: monthly
    parser_hint: >
      Full PDF report. Store raw copy; parse with pypdf or pdfplumber
      (later). Tables in appendix are primary structured data source.
    active: true
    notes: PDF URL pattern changes per edition; update source_id and url each release.

  # ── State Siting Boards ──────────────────────────────────────────────────
  - source_id: ohio_opsb_cases
    url: https://opsb.ohio.gov/cases/
    publisher: Ohio Power Siting Board
    document_type: siting_board
    jurisdiction_type: state
    state: OH
    fetch_method: static
    schedule: weekly
    parser_hint: >
      Case list table with project name, technology, county, status,
      filing date. Filter for wind and solar. Each row links to a
      case detail page with hearing dates and orders.
    active: true
    notes: >
      Ohio SB 52 (2021) gave county commissioners veto power; OPSB cases
      are the upstream record for what gets vetoed downstream.

  - source_id: ny_ocs_article10
    url: https://www.dps.ny.gov/OCS/ArticleXHomeFrame.htm
    publisher: New York Office of Clean Energy Siting
    document_type: siting_board
    jurisdiction_type: state
    state: NY
    fetch_method: static
    schedule: weekly
    parser_hint: >
      Article 10 / Article 94-c case list. Contains project name,
      developer, capacity, county, status. Intervenor filings indicate
      contested projects.
    active: false
    notes: >
      NY consolidated siting under OCS; Article 94-c applies to large renewables.
      This URL answers 404 (checked 2026-10-13); the case list now lives at
      dps.ny.gov/ores-permit-applications (ny_ores_permit_applications below).

  - source_id: mi_egle_wind_solar
    url: https://www.michigan.gov/egle/about/organization/Materials-Management/renewable-energy
    publisher: Michigan EGLE
    document_type: siting_board
    jurisdiction_type: state
    state: MI
    fetch_method: static
    schedule: monthly
    parser_hint: >
      Project lists and permit decisions for wind and solar. Look for
      contested permit decisions and local ordinance preemption cases.
    active: true
    notes: Michigan PA 233 (2023) preempts some local restrictions; track
      conflicts between state approvals and local bans.

  # ── County / Municipal Code & Agendas ───────────────────────────────────
  - source_id: municode_national
    url: https://library.municode.com/
    publisher: Municode Library
    document_type: code_section
    jurisdiction_type: national
    state: US
    fetch_method: static
    schedule: monthly
    parser_hint: >
      Search interface for municipal codes nationwide. Targeted searches
      for terms: "solar", "wind energy", "moratorium", "setback",
      "prohibited". Results link to specific code sections.
      Use search API or structured URL patterns per jurisdiction.
    active: true
    notes: >
      Not a single page to fetch — use as a search endpoint.
      Future: build targeted queries per jurisdiction of interest.

  - source_id: cooke_county_tx_commissioners
    url: https://www.cookecounty.net/commissioners-court
    publisher: Cooke County Texas Commissioners Court
    document_type: meeting_minutes
    jurisdiction_type: county
    state: TX
    fetch_method: static
    schedule: monthly
    parser_hint: >
      Agenda and minutes archive for commissioners court. Look for
      resolutions referencing wind energy, solar, or renewable facilities.
    active: true
    notes: Cooke County enacted a wind ban in 2022 via commissioners resolution.

  # ── Court Dockets ────────────────────────────────────────────────────────
  - source_id: pacer_federal
    url: https://pacer.uscourts.gov/
    publisher: PACER (federal courts)
    document_type: docket
    jurisdiction_type: national
    state: US
    fetch_method: static
    schedule: weekly
    parser_hint: >
      Search PACER for cases with keywords: "wind farm", "solar farm",
      "renewable energy", "siting", "NEPA", "viewshed". Requires
      PACER credentials. Use case search API when available.
    active: false
    notes: >
      Marked inactive until PACER credentials are configured.
      Consider courtlistener.com (free) as an alternative first pass.

  - source_id: courtlistener_renewables
    # highlight=on: without it each result's snippet is the opinion's first
    # 500 characters (court headers, slip-opinion notices), not the matched
    # text the extractor reads for a technology.
    url: https://www.courtlistener.com/api/rest/v4/search/?q=%28%22wind+farm%22+OR+%22solar+farm%22+OR+%22wind+energy%22+OR+%22solar+energy%22+OR+%22battery+storage%22%29+AND+%28ordinance+OR+moratorium+OR+setback+OR+siting+OR+zoning%29&type=o&order_by=dateFiled+desc&highlight=on
    publisher: CourtListener (Free Law Project)
    document_type: docket
    jurisdiction_type: national
    state: US
    fetch_method: api
    schedule: weekly
    expect: json
    compress: true
    # Anonymous use is capped at 125 requests a day per IP. A token (free with
    # an account) in the COURTLISTENER_API_TOKEN repository secret is sent when
    # set; one request a week fits either way.
    auth_env: COURTLISTENER_API_TOKEN
    auth_prefix: "Token "
    parser_hint: >
      Free full-text search of federal and state court opinions.
      Filter by: filed_after, jurisdiction, keyword clusters
      (moratorium, setback, siting, ordinance). The URL is the v4 search
      API (JSON, first page of opinions, newest first); the extractor
      scripts/extractors/courtlistener_renewables.py turns each result into
      a case candidate in data/review/queue.csv.
    active: true
    notes: >
      Best free-tier court data source. Covers opinions but not all
      docket entries. Supplement with PACER for full dockets later.

  # ── Live intake ──────────────────────────────────────────────────────────
  # Fetched weekly by .github/workflows/intake.yml. Every candidate an
  # extractor finds enters data/review/queue.csv as a lead (review_status
  # lead, access snippet): never promoted, never counted on a page, until a
  # reviewer triages it (README, "Live intake").

  - source_id: ny_ores_permit_applications
    url: https://dps.ny.gov/ores-permit-applications
    publisher: New York Office of Renewable Energy Siting and Electric Transmission (ORES)
    document_type: siting_board
    jurisdiction_type: state
    state: NY
    fetch_method: static
    schedule: weekly
    expect: html
    expect_contains: Permit Application
    compress: true
    parser_hint: >
      Static HTML, one table per section (Notices of Intent, pending
      completeness, incomplete, complete under review, permitted, withdrawn or
      relinquished, denied, request for declaratory ruling). Each row: case
      number, project name, and a description with capacity, towns and county.
      Denied and withdrawn applications are contested-project leads, and so is
      an application in any section whose name matches a New York seed project,
      unless its section gives the outcome the seed already holds
      (scripts/extractors/ny_ores_permit_applications.py).
    active: true
    notes: Replaces ny_ocs_article10, whose URL now answers 404. expect_contains
      checked against the live page 2026-10-13 (the table header "Project Permit
      Application Number").

  - source_id: legistar_renewable_matters
    url: https://webapi.legistar.com/v1/{client}/matters
    publisher: Granicus Legistar Web API (county and city legislative records)
    document_type: meeting_minutes
    jurisdiction_type: county
    state: US
    fetch_method: api
    schedule: weekly
    expand_from: config/legistar_clients.json
    min_interval_s: 1
    expect: json
    compress: true
    params:
      $filter: "substringof('solar',MatterTitle) or substringof('photovoltaic',MatterTitle) or substringof('wind energy',MatterTitle) or substringof('wind farm',MatterTitle) or substringof('wind turbine',MatterTitle) or substringof('wind power',MatterTitle) or substringof('wind project',MatterTitle) or substringof('wind facilit',MatterTitle) or substringof('battery storage',MatterTitle) or substringof('energy storage',MatterTitle) or substringof('renewable energy',MatterTitle)"
      $top: 200
      $orderby: MatterIntroDate desc
    parser_hint: >
      JSON list of matters: MatterId, MatterGuid, MatterFile, MatterTitle,
      MatterTypeName, MatterStatusName, MatterIntroDate, MatterPassedDate,
      MatterBodyName. A moratorium, ordinance or zoning amendment on solar,
      wind or storage is a restriction lead; an appeal, denial or opposition
      on a facility, or a permit decision on a named one, is a
      contested-project lead; the county buying, leasing, funding or
      installing solar is dropped. The public link is
      https://{client}.legistar.com/Gateway.aspx?M=L&ID={MatterId}, which
      redirects to the matter page (LegislationDetail.aspx built from the
      API's MatterId and MatterGuid answers "Invalid parameters!": the public
      site numbers matters with its own ID and GUID).
    active: true
    notes: >
      Clients and their counties are listed in config/legistar_clients.json
      (verified clients from pricephillips/data-center-map's legistar_probe
      that hold renewable records). A matter is the legislative record, not
      the instrument: access stays snippet until someone opens the attachment.
      The filter takes 'solar' alone (substringof is case-insensitive), since
      named projects ("Rezoning Case CZ-2021-007 Blue Star Solar", "Lockhart
      Solar Zoning Amendment") carry no other term; the extractor drops the
      county's own solar purchases, leases and devices. No bare 'wind' or
      'battery': they match Windsor, windows and liquor-license batteries.
      On 2026-10-13 this filter returned 258 matters across the 11 clients
      (the earlier phrase list: 194), and 50 leads (44).

  - source_id: ny_dos_local_laws
    # The search behind https://dos.ny.gov/local-laws (its script,
    # locallaws.static-assets.ny.gov/local-laws.js, builds these parameters).
    url: https://locallaws.static-assets.ny.gov/api/search
    publisher: New York Department of State (local laws filed under Municipal Home Rule Law section 27)
    document_type: ordinance
    jurisdiction_type: municipality
    state: NY
    fetch_method: api
    schedule: weekly
    expect: json
    expect_contains: '"query_syntax_ok"'
    compress: true
    params:
      query: 'cat:(Local Laws) AND subject1:(solar OR photovoltaic OR wind OR windmill OR windmills OR battery OR batteries OR "energy storage" OR BESS OR renewable) AND -(countyMunicipalType:County)'
      sort: -dateFiled
      limit: 100
      offset: 0
      expand: metadata
      search_document_text: "false"
    parser_hint: >
      JSON: total_count and items, each with metadata.fields (municipalityType,
      municipalityName, lawNumber, year, dateFiled, subject1: the law's title
      as filed), external_id and filename. The filed copy of the law (the
      filing form and the law's text) is the PDF at
      https://itswebny.widen.net/content/{external_id}/pdf/{filename}. The
      search stems its terms (renewal, windows), so the extractor reads the
      subject again and keeps local laws on siting solar, wind or storage:
      moratoria, prohibitions, siting and zoning laws; tax, PILOT and RPTL 487
      laws, repeals that adopt nothing new, small-scale systems and single-site
      rezonings are dropped (scripts/extractors/ny_dos_local_laws.py).
    active: true
    notes: >
      Every local law a New York county, city, town or village adopts is filed
      with the Department of State, so the filed copy is the instrument itself
      (source_kind official_copy): a lead whose PDF a reviewer opens is
      verified against its primary source. -(countyMunicipalType:County) leaves
      out the county code compilations, as the site's own search does; county
      local laws stay in. The newest 100 filings covered 2026-08-14 to
      2026-10-21 on 2026-10-28, ten weeks, so a weekly run overlaps the last
      and parse.py's dedupe drops the overlap. On 2026-10-28 the query matched
      3,551 filings in all; of the newest 300 (back to 2026-03-23), the
      extractor kept 282 and dropped 18, and the 282 became 278 leads (four
      laws filed twice, a corrected copy beside the first). The newest 100
      alone gave 93 leads. parse.dedupe found none of the 278 already held and
      noted 32 as possible duplicates (the same government and technology as a
      held record or another lead).

  # Change detection only (watch: true): nothing parses these. A stored copy
  # means the upstream changed, and the intake summary says what to run.
  - source_id: moratorium_nation_upstream
    url: https://api.github.com/repos/mjbommar/moratorium-data-2026/commits?path=data/moratorium_inventory.csv&per_page=1
    publisher: Moratorium Nation (GitHub commits API)
    document_type: tracker
    jurisdiction_type: national
    state: US
    fetch_method: api
    schedule: weekly
    expect: json
    auth_env: GH_API_TOKEN
    auth_prefix: "Bearer "
    watch: true
    on_change: "Moratorium Nation changed upstream: run python scripts/run_pipeline.py refresh --only fetch_moratorium_nation and read data/processed/diff_summary.md"
    active: true
    notes: The newest commit to the inventory file that fetch_moratorium_nation.py reads from main.

  - source_id: sabin_web_database_restrictions
    url: https://oppositionreport.org/wp-load.php?security_key=04611eaf3d6d15e6&export_id=7&action=get_data
    publisher: Columbia Sabin Center for Climate Change Law (oppositionreport.org export)
    document_type: report
    jurisdiction_type: national
    state: US
    fetch_method: static
    schedule: weekly
    expect: csv
    compress: true
    watch: true
    on_change: "The Sabin web database's restrictions export changed: compare it with data/raw/sabin_2026_09_restrictions_csv/ before running the Sabin refresh stages"
    active: true
    notes: The same export fetch_sabin_edition.py stores for the September 2026 edition; the web database is updated monthly.

  - source_id: sabin_web_database_projects
    url: https://oppositionreport.org/wp-load.php?security_key=bec1e2337cf73fbe&export_id=8&action=get_data
    publisher: Columbia Sabin Center for Climate Change Law (oppositionreport.org export)
    document_type: report
    jurisdiction_type: national
    state: US
    fetch_method: static
    schedule: weekly
    expect: csv
    compress: true
    watch: true
    on_change: "The Sabin web database's contested-projects export changed: compare it with data/raw/sabin_2026_09_projects_csv/ before running the Sabin refresh stages"
    active: true
    notes: Companion to sabin_web_database_restrictions.

  # Last on purpose: GDELT is the slowest source and the one most often
  # throttled, and fetch.py takes sources in file order under a time budget,
  # so a throttled week can only cost GDELT's own queries.
  - source_id: gdelt_renewable_news
    url: https://api.gdeltproject.org/api/v2/doc/doc
    publisher: The GDELT Project (DOC 2.0 API)
    document_type: news
    jurisdiction_type: national
    state: US
    fetch_method: api
    schedule: weekly
    # GDELT asks for one request every 5 seconds and answers a malformed query
    # with HTTP 200 and a line of text, so the pace is 6 s, a non-JSON body is
    # refused, and a 429 is retried after 20 s, then 60 s.
    min_interval_s: 6
    expect: json
    retry: {statuses: [429], backoff_s: [20, 60]}
    compress: true
    # Fifteen days for a weekly run: the second week covers one failed or
    # skipped run, and parse.py's dedupe drops the overlap.
    requests:
      - label: moratorium
        params: {query: '("solar farm" OR "solar project" OR "solar facility" OR "wind farm" OR "wind project" OR "wind turbines" OR "battery storage" OR "energy storage") (moratorium OR moratoria OR ban) sourcecountry:US', mode: artlist, format: json, maxrecords: 250, timespan: 15d, sort: datedesc}
      - label: zoning
        params: {query: '("solar farm" OR "solar project" OR "solar facility" OR "wind farm" OR "wind project" OR "battery storage") (ordinance OR setback OR setbacks OR rezoning OR "conditional use" OR "special use permit") sourcecountry:US', mode: artlist, format: json, maxrecords: 250, timespan: 15d, sort: datedesc}
      - label: denial
        params: {query: '("solar farm" OR "solar project" OR "solar facility" OR "wind farm" OR "wind project" OR "battery storage") (denied OR denies OR rejected OR "voted down" OR withdrawn OR withdraws) sourcecountry:US', mode: artlist, format: json, maxrecords: 250, timespan: 15d, sort: datedesc}
      - label: litigation
        params: {query: '("solar farm" OR "solar project" OR "wind farm" OR "wind project" OR "battery storage") (lawsuit OR sued OR appeal OR "legal challenge") sourcecountry:US', mode: artlist, format: json, maxrecords: 250, timespan: 15d, sort: datedesc}
      - label: organizing
        params: {query: '("solar farm" OR "solar project" OR "wind farm" OR "wind project" OR "battery storage") (residents OR neighbors OR petition OR referendum OR opponents) sourcecountry:US', mode: artlist, format: json, maxrecords: 250, timespan: 15d, sort: datedesc}
    parser_hint: >
      ArtList JSON: url, title, seendate (a crawl date, never an event date),
      domain, language, sourcecountry. GDELT matches full text, so the
      extractor keeps a headline only if it names a renewable technology and
      an opposition mechanism, and places it only when the headline names the
      county (and its state, unless the name is unique).
    active: true
    notes: >
      Discovery only: a headline locates a story; the article must be opened
      before anything is promoted. Practice ported from
      pricephillips/data-center-map signal_harvest.py, with its fixes (pacing,
      no bare county names, dedupe against every cited URL).

  # ── NGO / Advocacy Trackers ──────────────────────────────────────────────
  - source_id: clean_grid_alliance_tracker
    url: https://www.cleangridalliance.org/resources
    publisher: Clean Grid Alliance
    document_type: tracker
    jurisdiction_type: national
    state: US
    fetch_method: static
    schedule: monthly
    parser_hint: >
      Policy and legislative tracker for Midwest states. Look for
      state-level preemption bills, county ordinance databases,
      and project opposition summaries.
    active: true
    notes: Midwest-focused; good complement to Sabin for MN, WI, IA, IL.

  - source_id: seia_state_policy
    url: https://www.seia.org/states-map
    publisher: Solar Energy Industries Association
    document_type: tracker
    jurisdiction_type: national
    state: US
    fetch_method: js_render
    schedule: monthly
    parser_hint: >
      State-by-state policy map. Fetch each state detail page for
      legislative and regulatory activity. JS-rendered; requires
      playwright. Lower priority until playwright layer is added.
    active: false
    notes: Marked inactive until js_render support is implemented.
